<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengingat Jadwal Mengajar</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#1a1a1a">

</head>

<body>

<header>
<h1>📚 Pengingat Jadwal Mengajar</h1>
</header>

<main>

<section class="card">

<button id="btnNotif">Aktifkan Notifikasi</button>

<p id="statusNotif">Status: belum aktif</p>
<p id="infoPWA"></p>

</section>

<section class="card">

<h2>Tambah / Edit Jadwal</h2>

<form id="formJadwal">

<select id="hari" required>
<option value="">Pilih Hari</option>
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
</select>

<input type="time" id="jam" required>
<input type="text" id="mapel" placeholder="Mata Pelajaran" required>
<input type="text" id="kelas" placeholder="Kelas" required>

<button type="submit">Simpan Jadwal</button>

</form>

</section>

<section class="card">

<h2>Jadwal Saya</h2>
<ul id="listJadwal"></ul>

<button id="exportBtn">Backup Jadwal</button>
<input type="file" id="importFile">

</section>

</main>

<script src="app.js"></script>

<script>
    if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {

    const reg = await navigator.serviceWorker.register("./sw.js");

    console.log("SW aktif");

    // cek update
    reg.onupdatefound = () => {
      const newWorker = reg.installing;

      newWorker.onstatechange = () => {
        if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
          console.log("Versi baru tersedia, reload halaman");
          window.location.reload();
        }
      };
    };

  });
}
  </script>

</body>
</html>
